name: CI Proyecto Full Stack

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  validar-docker:
    name: Validar Docker
    runs-on: ubuntu-latest
    needs:
      - validar-backend
      - validar-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen backend
        run: docker build ./backend -t practica2-backend:v1
      - name: Construir imagen frontend
        run: docker build ./frontend -t practica2-frontend:v1
name: CI Proyecto Full Stack - Docker

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  validar-docker:
    name: Validar Docker
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Validar Docker Compose
        run: docker compose config
      - name: Construir imágenes Docker
        run: docker compose build

  desplegar:
    name: Desplegar en EC2
    runs-on: self-hosted
    needs: validar-docker
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Desplegar con Docker Compose
        run: |
          docker compose down || true
          docker compose up -d --build
          docker ps

      - name: Mostrar URL
        run: |
          PUBLIC_IP=$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)
          echo "========================================="
          echo " TU APP ESTA EN: http://$PUBLIC_IP:8080"
          echo "========================================="